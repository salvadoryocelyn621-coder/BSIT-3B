        /* Navigation Bar */
        .navbar {

            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
            padding: 12px 20px;
            z-index: 100;
            box-shadow: 0 4px 12px rgba(192, 145, 16, 0.2);
        }
        .navbar ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }
        .navbar a {
            color: white;

            font-weight: 600;
            font-size: 15px;
            padding: 8px 16px;
            border-radius: 6px;
            transition: background 0.3s ease;
        }
        .navbar a:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .main-wrapper {
            max-width: 800px;
